<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="stylesheet.css">
    <title>Tic-Tac-Toe</title>
</head>
<body>
    <div class="container">
        <div class="top">
            <h1>Tic Tac Toe</h1>
        </div>
        <div class="workspace">
            <div class="score">
                <div class="currPlayer">
                    <div class="currplay">Current Player:</div>
                    <div class="mark">X</div>
                </div>
                <div class="player">
                    <div class="indvPlay"> Player X</div>
                    <div class="indvScr" id="playerX">0</div>
                </div>
                <div class="player">
                    <div class="indvPlay"> Draw</div>
                    <div class="indvScr" id="currDraw">0</div>
                </div>
                <div class="player">
                    <div class="indvPlay"> Player O</div>
                    <div class="indvScr" id="playerO">0</div>
                </div>
            </div>
            <div class="whatHappning">
                <div class="ques">Current Status:</div>
                <div class="ans">Game is ON</div>
            </div>
            <div class="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>
            <div class="newGame">
                <button>Restart</button>
            </div>
        </div>
    </div>
</body>
</html>
